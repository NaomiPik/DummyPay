[pytest]
# Folder where pytest looks for test files
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Base URL of the system under test (used by pytest-playwright)
base_url = https://dummypay.vercel.app

# Default options: short output, show the reason for skipped/failed tests
addopts = -ra -v -s

# Custom markers (must be registered here, otherwise pytest shows warnings)
markers =
    smoke: fast, critical tests that run on every pull request
    regression: full test suite that runs nightly and on merge to main
    negative: tests that verify error handling and invalid input